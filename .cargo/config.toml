# K_BUILD: Cargo build configuration
# Node: build_config
# Edges:
#   build_config --[cross_compile]--> x86_64-gos-kernel (target node)
#   build_config --[runner]---------> qemu (executor node)

[build]
target = "x86_64-gos-kernel.json"

# build-std: compile core + alloc from source for our custom JSON target.
# This is a stable Cargo nightly feature since 2022.
[unstable]
build-std         = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec   = true

# ADR-018 (2026-08-04): the `bootimage runner` this used to point at
# doesn't exist anymore -- migrated off bootloader 0.9.23's bootimage-
# subcommand pipeline to bootloader_api 0.11.9 (UEFI-only). There's no
# drop-in `cargo run` replacement: building a UEFI disk image needs a
# real build step (bootloader::UefiBoot::create_disk_image), not
# something a `runner` wrapper script can do standing between "binary
# built" and "binary executed". Use `cd xtask && cargo run -- run`
# instead (see xtask/src/main.rs's `run_interactive`).
