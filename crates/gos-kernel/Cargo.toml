k-fat32 = { path = "../k-fat32" }
k-fb = { path = "../k-fb" }
k-rast = { path = "../k-rast" }
k-assets = { path = "../k-assets" }
libm = "0.2"
spin = "0.9"
# Already a dep (declared above) but kept for grep visibility — the
# I.3.11 hit-test reads `MOUSE_X` / `MOUSE_Y` / `MOUSE_BUTTONS`
# directly from k-mouse.
# ADR-018 (2026-08-04): migrated off bootloader 0.9.23's `bootimage`-
# subcommand pipeline to bootloader_api 0.11.9, UEFI-only (the real
# target hardware -- a 2014 Mac mini -- needs native UEFI boot; the
# BIOS path also hit its own separate, real incompatibility with this
# project's pinned nightly, see ADR-018 §六). Pinned exact: the
# bootloader stage checks this at boot time and panics on any mismatch
# against xtask's `bootloader` pin (xtask/Cargo.toml). Physical-memory
# mapping (former `map_physical_memory` feature) and the framebuffer
# request are now explicit in main.rs's BOOTLOADER_CONFIG, not Cargo
# features. `run-args`/`test-args` below moved to xtask's `run`/`qemu`
# verbs (see xtask/src/main.rs) since `[package.metadata.bootimage]`
# has no meaning without the `bootimage` tool.
bootloader_api = "=0.11.9"
x86_64 = "0.14"
