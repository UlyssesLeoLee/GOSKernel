[workspace]
members = []
exclude = ["kernel"]

[package]
name = "toy-os-builder"
version = "0.1.0"
edition = "2021"

# Known broken as of 2026-08-04 -- see ADR-018 §四. "0.11" resolves to
# 0.11.17 today, which fails (x86_64 v0.15.5 vs this project's pinned
# nightly-2026-04-02, E0407). Pinning to =0.11.7 also fails (x86_64
# v0.14.10, E0053) -- the two point releases straddle the nightly's
# compatible window from opposite sides. Left unpinned intentionally so
# the next attempt starts from upstream's current default, not a stale
# guess.
[dependencies]
bootloader = "0.11"

[[bin]]
name = "runner"
path = "src/main.rs"
