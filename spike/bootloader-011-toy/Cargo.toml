[workspace]
members = []
exclude = ["kernel"]

[package]
name = "toy-os-builder"
version = "0.1.0"
edition = "2021"

# "0.11" (latest, 0.11.17) and "=0.11.7" both fail -- see ADR-018 §四.
# 0.11.9 is the last point release before upstream bumped its internal
# bios/uefi stage crates from `x86_64 = "0.14.8"` to `"0.15.2"` (checked
# via bios/stage-4/Cargo.toml at each tag on GitHub, not guessed) --
# "0.14.8" is a caret req, so it resolves to 0.14.13 today, the same
# x86_64 release this repo's own crates/gos-kernel already pins.
#
# default-features=false, features=["uefi"]: bootloader 0.11.9's own
# bundled BIOS-stage target JSON files use an old target-spec schema
# this nightly's rustc rejects (ADR-018 §六) -- disabling the `bios`
# feature skips those sub-crates entirely, which is also the only mode
# this project's actual target hardware (2014 Mac mini, UEFI-only
# firmware) needs. See ADR-018 §六 for the full end-to-end proof this
# builds and boots a kernel matching gos-kernel's real ELF shape.
[dependencies]
bootloader = { version = "=0.11.9", default-features = false, features = ["uefi"] }

[[bin]]
name = "runner"
path = "src/main.rs"
