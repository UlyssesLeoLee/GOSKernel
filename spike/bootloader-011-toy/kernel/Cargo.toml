[workspace]

[package]
name = "toy-kernel"
version = "0.1.0"
edition = "2021"

# Must match the host-side `bootloader` version in ../Cargo.toml
# exactly -- the bootloader stage code checks this at boot time and
# panics ("incompatible bootloader_api version") on any mismatch,
# verified the hard way in ADR-018 §六.
[dependencies]
bootloader_api = "=0.11.9"

[[bin]]
name = "toy-kernel"
path = "src/main.rs"
