# Mirrors the real crates/gos-kernel's own .cargo/config.toml exactly,
# to test whether bootloader 0.11.9 can load a kernel built with this
# project's actual custom target (fixed ET_EXEC, no PIE/code-model
# override) rather than the built-in x86_64-unknown-none.
[build]
target = "x86_64-gos-kernel.json"

[unstable]
build-std          = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec    = true
